<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff4ed" />
  <title>23 Months With You</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
    :root { --ink:#3d2638; --pink:#d982a1; --cream:#fff8f0; --red:#c95d68; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); background:radial-gradient(ellipse at 52% 43%, #fffdf8 0%, #fff8f4 45%, #f2dce5 100%); font-family:'DM Sans',sans-serif; }
    .scene { min-height:100svh; display:grid; place-items:center; position:relative; isolation:isolate; padding:24px; }
    .glow { position:absolute; width:min(76vw,650px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(224,153,179,.28),rgba(240,210,220,.12) 55%,transparent 70%); filter:blur(5px); z-index:-1; }
    .sparkles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .spark { position:absolute; color:#c990a6; opacity:.72; animation:twinkle 3.2s ease-in-out infinite; }
    .spark:nth-child(1){left:18%;top:24%;font-size:22px}.spark:nth-child(2){left:78%;top:28%;font-size:16px;animation-delay:.8s}.spark:nth-child(3){left:22%;top:72%;font-size:14px;animation-delay:1.4s}.spark:nth-child(4){left:81%;top:68%;font-size:24px;animation-delay:.5s}.spark:nth-child(5){left:66%;top:17%;font-size:12px;animation-delay:1.8s}
    .card { width:min(100%,580px); text-align:center; position:relative; padding:44px 30px 38px; border:1px solid rgba(255,255,255,.85); border-radius:32px; background:rgba(255,255,255,.52); box-shadow:0 24px 80px rgba(92,48,74,.12), inset 0 1px rgba(255,255,255,.9); backdrop-filter:blur(12px); }
    .eyebrow { margin:0 0 11px; text-transform:uppercase; letter-spacing:.24em; font-size:10px; font-weight:700; color:#a87589; }
    h1 { margin:0; font:700 clamp(29px,6vw,42px)/1.12 'Playfair Display',serif; letter-spacing:-.035em; }
    .subtitle { margin:12px 0 0; color:#8e747c; font-size:14px; }
    .stage { height:310px; display:grid; place-items:center; perspective:1000px; position:relative; margin:3px auto 0; }
    .shadow { position:absolute; bottom:31px; width:160px; height:25px; border-radius:50%; background:rgba(93,52,67,.18); filter:blur(12px); transition:.7s ease; }
    .ball-wrap { width:190px; height:190px; position:relative; transform-style:preserve-3d; transition:transform .18s ease-out; animation:float 4s ease-in-out infinite; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; }
    .ball { position:absolute; inset:0; border-radius:50%; transform-style:preserve-3d; filter:drop-shadow(0 16px 13px rgba(88,49,57,.15)); }
    .hemisphere { position:absolute; left:0; width:100%; height:50%; overflow:hidden; background:linear-gradient(155deg,#ff7972 0%,#ed4c50 48%,#d83b48 100%); border:1px solid rgba(122,37,49,.14); }
    .top { top:0; border-radius:100px 100px 0 0 / 95px 95px 0 0; box-shadow:inset 9px 10px 15px rgba(255,255,255,.4), inset -8px -2px 15px rgba(149,27,43,.18); }
    .bottom { bottom:0; border-radius:0 0 100px 100px / 0 0 95px 95px; background:linear-gradient(20deg,#fff7ef 0%,#fffdf8 50%,#eddfd5 100%); box-shadow:inset 8px -10px 15px rgba(255,255,255,.92), inset -7px 0 14px rgba(108,70,66,.12); }
    .seam { position:absolute; top:calc(50% - 6px); left:-2px; width:calc(100% + 4px); height:12px; background:linear-gradient(#422b35,#211b26 45%,#4f3540); z-index:2; box-shadow:0 2px 5px rgba(40,22,30,.28); }
    .button { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:linear-gradient(145deg,#fffefa,#e9ddd5); box-shadow:0 0 0 7px #33242e, inset 0 2px 6px white, 0 4px 8px #301d2d66; display:grid; place-items:center; }
    .button::before { content:''; width:23px; height:23px; border-radius:50%; background:linear-gradient(145deg,#fff,#f5e8e1); border:1px solid rgba(85,48,60,.12); box-shadow:inset 0 1px 2px white; }
    .shine { position:absolute; width:61px; height:13px; top:35px; left:34px; border-radius:50%; background:rgba(255,255,255,.63); transform:rotate(-32deg); filter:blur(2px); }
    .ball-wrap:hover { filter:brightness(1.035); }
    .ball-wrap:focus-visible { filter:drop-shadow(0 0 0.6rem #f19aaa); }
    .hint { margin:-7px 0 0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#ae8d91; font-weight:600; }
    .reveal { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transform:translateY(12px) scale(.92); pointer-events:none; transition:opacity .65s ease .28s,transform .7s cubic-bezier(.2,.8,.2,1) .28s; }
    .message { position:relative; z-index:4; font:800 clamp(32px,7.5vw,59px)/1.04 'Playfair Display',serif; letter-spacing:-.055em; color:#a34d70; text-shadow:0 3px white,0 10px 25px rgba(139,62,99,.2); }
    .heart { display:inline-block; color:#cf557c; font-family:Arial,sans-serif; font-size:.88em; margin-left:5px; transform-origin:center; animation:heartbeat 1s ease-in-out infinite; }
    .wish { position:absolute; top:calc(50% + 62px); color:#8f6c7d; font:italic 15px 'Playfair Display',serif; letter-spacing:.02em; }
    .opened .ball-wrap { animation:none; pointer-events:none; }
    .opened .ball { animation:openBall 1.35s cubic-bezier(.16,.72,.23,1) forwards; }
    .opened .shadow { transform:scaleX(.74); opacity:.44; }
    .opened .reveal { opacity:1; transform:translateY(-5px) scale(1); }
    .opened .hint { opacity:0; transition:opacity .2s; }
    .confetti { position:absolute; inset:0; z-index:5; overflow:hidden; pointer-events:none; }
    .confetti i { position:absolute; left:50%; top:52%; width:8px; height:12px; border-radius:2px; opacity:0; background:var(--c); animation:burst 1.2s cubic-bezier(.13,.68,.23,1) var(--d) forwards; }
    .again { margin-top:22px; opacity:0; pointer-events:none; border:0; border-radius:999px; padding:11px 19px; color:#945562; background:#fff5f1; font:600 12px 'DM Sans',sans-serif; letter-spacing:.04em; box-shadow:0 4px 16px #8e58601c; cursor:pointer; transition:opacity .3s .7s,transform .2s,background .2s; }
    .again:hover { transform:translateY(-2px); background:white; }
    .opened .again { opacity:1; pointer-events:auto; }
    .footer { position:absolute; bottom:23px; color:#a98d9a; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
    @keyframes float { 0%,100%{transform:translateY(0) rotateX(-7deg) rotateY(-11deg)} 50%{transform:translateY(-10px) rotateX(4deg) rotateY(9deg)} }
    @keyframes twinkle { 0%,100%{transform:scale(.75) rotate(0);opacity:.35} 50%{transform:scale(1.15) rotate(18deg);opacity:.9} }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.18)} 28%{transform:scale(1)} 42%{transform:scale(1.12)} 70%{transform:scale(1)} }
    @keyframes openBall { 0%{transform:rotateX(0)} 25%{transform:rotateX(-8deg)} 100%{transform:rotateX(0)} }
    .opened .top { animation:topOpen 1.1s cubic-bezier(.15,.72,.21,1) forwards; }
    .opened .bottom { animation:bottomOpen 1.1s cubic-bezier(.15,.72,.21,1) forwards; }
    .opened .seam { animation:seamFade .35s ease forwards; }
    .opened .button { animation:buttonPop .5s ease forwards; }
    @keyframes topOpen { to { transform:translateY(-92px) translateZ(26px) rotateX(48deg); opacity:0; } }
    @keyframes bottomOpen { to { transform:translateY(91px) translateZ(-8px) rotateX(-35deg); opacity:0; } }
    @keyframes seamFade { to { opacity:0; } }
    @keyframes buttonPop { to { transform:translate(-50%,-50%) scale(1.5); opacity:0; } }
    @keyframes burst { 0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(.4)} 100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1)} }
    @media(max-width:500px) { .card{padding:37px 15px 31px;border-radius:26px}.stage{height:285px}.ball-wrap{transform:scale(.9)}.footer{bottom:13px}.wish{top:calc(50% + 45px)} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <main class="scene">
    <div class="glow" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true"><span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span></div>
    <section class="card" id="card" aria-label="Birthday surprise">
      <p class="eyebrow">For my favorite person</p>
      <h1>23 months of us</h1>
      <p class="subtitle">And every day, I find another reason to love you.</p>
      <div class="stage">
        <div class="shadow" aria-hidden="true"></div>
        <div class="ball-wrap" id="ball" role="button" tabindex="0" aria-label="Open the love note">
          <div class="ball" aria-hidden="true">
            <div class="hemisphere top"><span class="shine"></span></div>
            <div class="hemisphere bottom"></div>
            <div class="seam"></div><div class="button"></div>
          </div>
        </div>
        <div class="reveal" aria-live="polite"><div class="message">Happy 23 Months <span class="heart">♥</span></div><div class="wish">My favorite adventure is loving you.</div></div>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </div>
      <p class="hint">Open a little love note</p>
      <button class="again" id="again" type="button">Read it again ↻</button>
    </section>
    <div class="footer">23 months · a million little moments</div>
  </main>
  <script>
    const card = document.querySelector('#card');
    const ball = document.querySelector('#ball');
    const again = document.querySelector('#again');
    const confetti = document.querySelector('#confetti');
    let opened = false;

    function openBall() {
      if (opened) return;
      opened = true;
      card.classList.add('opened');
      confetti.innerHTML = '';
      const colors = ['#c95d78','#dfa9bc','#aa7896','#eac8b4','#bf8caa','#f2d9df'];
      for (let i = 0; i < 34; i++) {
        const bit = document.createElement('i');
        const angle = (Math.PI * 2 * i) / 34 + Math.random() * .24;
        const distance = 90 + Math.random() * 150;
        bit.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
        bit.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
        bit.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
        bit.style.setProperty('--d', `${Math.random() * .2}s`);
        bit.style.setProperty('--c', colors[i % colors.length]);
        confetti.appendChild(bit);
      }
    }
    function reset() {
      opened = false;
      card.classList.remove('opened');
      confetti.innerHTML = '';
      // Restart the opening animation cleanly on the next click.
      ball.querySelector('.ball').style.animation = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => ball.querySelector('.ball').style.animation = ''));
    }
    ball.addEventListener('click', openBall);
    ball.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openBall(); }
    });
    again.addEventListener('click', reset);
    card.addEventListener('pointermove', event => {
      if (opened || event.pointerType === 'touch') return;
      const bounds = card.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width - .5;
      const y = (event.clientY - bounds.top) / bounds.height - .5;
      ball.style.transform = `translateY(-3px) rotateX(${-y * 13}deg) rotateY(${x * 18}deg)`;
    });
    card.addEventListener('pointerleave', () => { if (!opened) ball.style.transform = ''; });
  </script>
</body>
</html>
